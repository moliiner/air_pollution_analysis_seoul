name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # the version that ran every notebook
          cache: pip
      - name: Install the pinned dependencies
        run: python run.py install
      - name: Install the dashboard dependencies, for its test
        run: pip install -r requirements-app.txt -c constraints.txt
      - name: Lint (unused imports and names)
        run: python run.py lint
      - name: Run the test suite, including the README figures (notebooks are not executed in CI)
        run: python run.py test
